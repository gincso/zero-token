name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk: 27.0.12077973

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties

      - name: Grant gradlew permission
        run: chmod +x apps/android/gradlew

      - name: Build Debug APK
        run: cd apps/android && ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
